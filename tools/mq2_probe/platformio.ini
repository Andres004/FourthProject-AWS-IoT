; SIS-234 Practice 4: MQ-2 calibration probe (board 1, ventilation).
; Standalone project, not part of the SmartLoft firmware. It only samples the
; MQ-2 analog output and prints one GAS_SAMPLE line per second, so the warm-up
; curve, the clean-air baseline and the smoke response can be recorded with
; tools/serial_logger.py.

[env:mq2_probe]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = default, log2file
; Opening the monitor must not reset the board.
monitor_dtr = 0
monitor_rts = 0
build_src_flags =
    -Wall
    -Wextra
