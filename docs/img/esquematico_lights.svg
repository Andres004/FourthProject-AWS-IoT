<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="Arial, Helvetica, sans-serif">
  <title>Placa 2 (luces y entrada): ESP32-DevKitC, cinco LEDs blancos con 220 Ω en GPIO 23, 22, 21, 19 y 18, PIR AM312 a 3V3 con salida en GPIO26, LED de estado de la conexión en GPIO32 y tierra común</title>
  <rect x="0" y="0" width="1060" height="700" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">Placa 2 · luces y entrada (Thing smartloft-739264-lights)</text>

  <!-- ===== ESP32 ===== -->
  <rect x="380" y="80" width="240" height="470" rx="8" fill="#f2f5f8" stroke="#2b2b2b" stroke-width="2"/>
  <text x="500" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32</text>
  <text x="500" y="129" text-anchor="middle" font-size="13" fill="#1a1a1a">DevKitC (38 pines)</text>
  <text x="500" y="520" text-anchor="middle" font-size="11" fill="#555555">alimentada solo por USB</text>
  <text x="500" y="534" text-anchor="middle" font-size="11" fill="#555555">no se conecta nunca a 5 V</text>
  <!-- left side: PIR and status LED -->
  <circle cx="380" cy="170" r="4" fill="#2b2b2b"/><text x="390" y="174" font-size="13" fill="#1a1a1a">3V3</text>
  <circle cx="380" cy="230" r="4" fill="#2b2b2b"/><text x="390" y="234" font-size="13" fill="#1a1a1a">GPIO26</text>
  <circle cx="380" cy="380" r="4" fill="#2b2b2b"/><text x="390" y="384" font-size="13" fill="#1a1a1a">GPIO32</text>
  <circle cx="380" cy="470" r="4" fill="#2b2b2b"/><text x="390" y="474" font-size="13" fill="#1a1a1a">GND</text>
  <!-- right side: lights -->
  <circle cx="620" cy="170" r="4" fill="#2b2b2b"/><text x="610" y="174" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO23</text>
  <circle cx="620" cy="240" r="4" fill="#2b2b2b"/><text x="610" y="244" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO22</text>
  <circle cx="620" cy="310" r="4" fill="#2b2b2b"/><text x="610" y="314" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO21</text>
  <circle cx="620" cy="380" r="4" fill="#2b2b2b"/><text x="610" y="384" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO19</text>
  <circle cx="620" cy="450" r="4" fill="#2b2b2b"/><text x="610" y="454" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO18</text>
  <circle cx="620" cy="510" r="4" fill="#2b2b2b"/><text x="610" y="514" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <!-- ===== GND bus (bottom) ===== -->
  <line x1="60" y1="590" x2="1010" y2="590" stroke="#3e2723" stroke-width="3"/>
  <text x="1010" y="610" text-anchor="end" font-size="12" fill="#3e2723" font-weight="bold">GND común (no se une a la placa 1)</text>
  <path d="M380 470 H360 V590" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="360" cy="590" r="5" fill="#3e2723"/>
  <path d="M620 510 H640 V590" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="640" cy="590" r="5" fill="#3e2723"/>

  <!-- ===== PIR AM312 ===== -->
  <rect x="70" y="140" width="170" height="130" rx="8" fill="#eefaf0" stroke="#2b2b2b" stroke-width="2"/>
  <text x="155" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">PIR AM312</text>
  <text x="155" y="182" text-anchor="middle" font-size="11" fill="#555555">entrada · cable PIR 45 cm</text>
  <text x="230" y="208" text-anchor="end" font-size="12" fill="#1a1a1a">VCC (rojo)</text>
  <text x="230" y="234" text-anchor="end" font-size="12" fill="#1a1a1a">OUT (azul)</text>
  <text x="230" y="260" text-anchor="end" font-size="12" fill="#1a1a1a">GND (negro)</text>
  <circle cx="240" cy="204" r="4" fill="#2b2b2b"/>
  <circle cx="240" cy="230" r="4" fill="#2b2b2b"/>
  <circle cx="240" cy="256" r="4" fill="#2b2b2b"/>
  <path d="M240 204 H300 V170 H380" fill="none" stroke="#c62828" stroke-width="3"/>
  <text x="340" y="162" text-anchor="middle" font-size="11" fill="#c62828">3.3 V</text>
  <line x1="240" y1="230" x2="380" y2="230" stroke="#2e7d32" stroke-width="3"/>
  <text x="310" y="222" text-anchor="middle" font-size="10" fill="#2e7d32">alto = movimiento</text>
  <path d="M240 256 H262 V372 A8 8 0 0 1 262 388 V590" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="262" cy="590" r="5" fill="#3e2723"/>

  <!-- ===== Status LED on GPIO32 ===== -->
  <path d="M380 380 H330" fill="none" stroke="#1565c0" stroke-width="3"/>
  <rect x="274" y="370" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="302" y="362" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
  <path d="M274 380 H200" fill="none" stroke="#1565c0" stroke-width="3"/>
  <!-- LED drawn pointing down: anode at the top -->
  <polygon points="186,380 214,380 200,404" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="186" y1="404" x2="214" y2="404" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="180" y1="388" x2="168" y2="380" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="180" y1="398" x2="168" y2="390" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="160" y="400" text-anchor="end" font-size="11" fill="#1a1a1a">LED de estado</text>
  <text x="160" y="414" text-anchor="end" font-size="10" fill="#555555">(conexión a AWS)</text>
  <line x1="200" y1="404" x2="200" y2="590" stroke="#3e2723" stroke-width="3"/>
  <circle cx="200" cy="590" r="5" fill="#3e2723"/>

  <!-- ===== Five zone lights ===== -->
  <!-- template per light: GPIO -> 220 ohm -> LED (anode) -> cathode -> GND bus at x=980 -->
  <g id="lights">
    <!-- Comedor GPIO23 -->
    <line x1="620" y1="170" x2="680" y2="170" stroke="#ef6c00" stroke-width="3"/>
    <rect x="680" y="160" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="708" y="153" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
    <line x1="736" y1="170" x2="800" y2="170" stroke="#ef6c00" stroke-width="3"/>
    <polygon points="800,156 800,184 824,170" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="824" y1="156" x2="824" y2="184" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="808" y1="152" x2="816" y2="142" stroke="#2b2b2b" stroke-width="1.5"/><line x1="816" y1="154" x2="824" y2="144" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="824" y1="170" x2="980" y2="170" stroke="#3e2723" stroke-width="3"/>
    <text x="840" y="162" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Comedor</tspan></text>
    <text x="840" y="188" font-size="11" fill="#555555">cable L-COM</text>

    <!-- Cocina GPIO22 -->
    <line x1="620" y1="240" x2="680" y2="240" stroke="#ef6c00" stroke-width="3"/>
    <rect x="680" y="230" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="708" y="223" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
    <line x1="736" y1="240" x2="800" y2="240" stroke="#ef6c00" stroke-width="3"/>
    <polygon points="800,226 800,254 824,240" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="824" y1="226" x2="824" y2="254" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="808" y1="222" x2="816" y2="212" stroke="#2b2b2b" stroke-width="1.5"/><line x1="816" y1="224" x2="824" y2="214" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="824" y1="240" x2="980" y2="240" stroke="#3e2723" stroke-width="3"/>
    <text x="840" y="232" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Cocina</tspan></text>
    <text x="840" y="258" font-size="11" fill="#555555">cable L-COC</text>

    <!-- Sala GPIO21 -->
    <line x1="620" y1="310" x2="680" y2="310" stroke="#ef6c00" stroke-width="3"/>
    <rect x="680" y="300" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="708" y="293" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
    <line x1="736" y1="310" x2="800" y2="310" stroke="#ef6c00" stroke-width="3"/>
    <polygon points="800,296 800,324 824,310" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="824" y1="296" x2="824" y2="324" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="808" y1="292" x2="816" y2="282" stroke="#2b2b2b" stroke-width="1.5"/><line x1="816" y1="294" x2="824" y2="284" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="824" y1="310" x2="980" y2="310" stroke="#3e2723" stroke-width="3"/>
    <text x="840" y="302" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Sala de estar</tspan></text>
    <text x="840" y="328" font-size="11" fill="#555555">cable L-SAL</text>

    <!-- Baño GPIO19 -->
    <line x1="620" y1="380" x2="680" y2="380" stroke="#ef6c00" stroke-width="3"/>
    <rect x="680" y="370" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="708" y="363" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
    <line x1="736" y1="380" x2="800" y2="380" stroke="#ef6c00" stroke-width="3"/>
    <polygon points="800,366 800,394 824,380" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="824" y1="366" x2="824" y2="394" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="808" y1="362" x2="816" y2="352" stroke="#2b2b2b" stroke-width="1.5"/><line x1="816" y1="364" x2="824" y2="354" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="824" y1="380" x2="980" y2="380" stroke="#3e2723" stroke-width="3"/>
    <text x="840" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Baño</tspan></text>
    <text x="840" y="398" font-size="11" fill="#555555">cable L-BAN</text>

    <!-- Habitación GPIO18 -->
    <line x1="620" y1="450" x2="680" y2="450" stroke="#ef6c00" stroke-width="3"/>
    <rect x="680" y="440" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="708" y="433" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
    <line x1="736" y1="450" x2="800" y2="450" stroke="#ef6c00" stroke-width="3"/>
    <polygon points="800,436 800,464 824,450" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="824" y1="436" x2="824" y2="464" stroke="#2b2b2b" stroke-width="2"/>
    <line x1="808" y1="432" x2="816" y2="422" stroke="#2b2b2b" stroke-width="1.5"/><line x1="816" y1="434" x2="824" y2="424" stroke="#2b2b2b" stroke-width="1.5"/>
    <line x1="824" y1="450" x2="980" y2="450" stroke="#3e2723" stroke-width="3"/>
    <text x="840" y="442" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Habitación</tspan></text>
    <text x="840" y="468" font-size="11" fill="#555555">cable L-HAB</text>
  </g>
  <!-- light GND bus -->
  <line x1="980" y1="170" x2="980" y2="590" stroke="#3e2723" stroke-width="3"/>
  <circle cx="980" cy="170" r="5" fill="#3e2723"/><circle cx="980" cy="240" r="5" fill="#3e2723"/>
  <circle cx="980" cy="310" r="5" fill="#3e2723"/><circle cx="980" cy="380" r="5" fill="#3e2723"/>
  <circle cx="980" cy="450" r="5" fill="#3e2723"/><circle cx="980" cy="590" r="5" fill="#3e2723"/>

  <!-- ===== Calculations and legend ===== -->
  <rect x="250" y="626" width="790" height="64" rx="6" fill="#f7f7f5" stroke="#d6d4cd"/>
  <text x="262" y="648" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Cada luz:</tspan> I = (3.3 V − V_LED) / 220 Ω = (3.3 − 3.0) V / 220 Ω ≈ 1.4 mA (LED blanco), muy por debajo del máximo de un GPIO</text>
  <text x="262" y="666" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">PIR:</tspan> VCC a 3V3 (nunca a 5 V); OUT en 3.3 V con movimiento, retención de 10 s en el firmware; calentamiento de 30 s</text>
  <text x="262" y="684" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Cables de 45 cm:</tspan> verde = ánodo (desde la resistencia), negro = cátodo (a GND). Etiqueta igual en las dos puntas.</text>
  <line x1="30" y1="634" x2="56" y2="634" stroke="#c62828" stroke-width="3"/><text x="62" y="638" font-size="11" fill="#1a1a1a">3.3 V</text>
  <line x1="30" y1="652" x2="56" y2="652" stroke="#3e2723" stroke-width="3"/><text x="62" y="656" font-size="11" fill="#1a1a1a">GND</text>
  <line x1="30" y1="670" x2="56" y2="670" stroke="#2e7d32" stroke-width="3"/><text x="62" y="674" font-size="11" fill="#1a1a1a">Señal del sensor</text>
  <line x1="130" y1="634" x2="156" y2="634" stroke="#ef6c00" stroke-width="3"/><text x="162" y="638" font-size="11" fill="#1a1a1a">Luces</text>
  <line x1="130" y1="652" x2="156" y2="652" stroke="#1565c0" stroke-width="3"/><text x="162" y="656" font-size="11" fill="#1a1a1a">LED de estado</text>
</svg>
