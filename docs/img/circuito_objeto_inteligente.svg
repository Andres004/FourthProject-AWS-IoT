<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="Arial, Helvetica, sans-serif">
  <title>Esquema eléctrico del objeto inteligente: ESP32 DOIT DevKit V1, servo SG90 y PIR AM312 a 5 V, LED de estado y tierra común</title>
  <rect x="0" y="0" width="920" height="540" fill="#ffffff"/>

  <!-- ESP32 -->
  <rect x="340" y="70" width="220" height="370" rx="8" fill="#f2f5f8" stroke="#2b2b2b" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32</text>
  <text x="450" y="120" text-anchor="middle" font-size="13" fill="#1a1a1a">DOIT DevKit V1</text>
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#555555">alimentado por USB (5 V)</text>
  <!-- left pins -->
  <circle cx="340" cy="150" r="4" fill="#2b2b2b"/><text x="350" y="154" font-size="13" fill="#1a1a1a">VIN (5 V)</text>
  <circle cx="340" cy="210" r="4" fill="#2b2b2b"/><text x="350" y="214" font-size="13" fill="#1a1a1a">GND</text>
  <circle cx="340" cy="270" r="4" fill="#2b2b2b"/><text x="350" y="274" font-size="13" fill="#1a1a1a">D13 (GPIO13)</text>
  <!-- right pins -->
  <circle cx="560" cy="150" r="4" fill="#2b2b2b"/><text x="550" y="154" text-anchor="end" font-size="13" fill="#1a1a1a">5 V (VIN)</text>
  <circle cx="560" cy="210" r="4" fill="#2b2b2b"/><text x="550" y="214" text-anchor="end" font-size="13" fill="#1a1a1a">D26 (GPIO26)</text>
  <circle cx="560" cy="320" r="4" fill="#2b2b2b"/><text x="550" y="324" text-anchor="end" font-size="13" fill="#1a1a1a">D32 (GPIO32)</text>
  <circle cx="560" cy="380" r="4" fill="#2b2b2b"/><text x="550" y="384" text-anchor="end" font-size="13" fill="#1a1a1a">GND</text>

  <!-- Servo SG90 -->
  <rect x="50" y="110" width="170" height="190" rx="8" fill="#eef4ff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="135" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Servo SG90</text>
  <text x="210" y="154" text-anchor="end" font-size="12" fill="#1a1a1a">V+ (rojo)</text>
  <text x="210" y="214" text-anchor="end" font-size="12" fill="#1a1a1a">GND (marrón)</text>
  <text x="210" y="274" text-anchor="end" font-size="12" fill="#1a1a1a">Señal (naranja)</text>
  <circle cx="220" cy="150" r="4" fill="#2b2b2b"/>
  <circle cx="220" cy="210" r="4" fill="#2b2b2b"/>
  <circle cx="220" cy="270" r="4" fill="#2b2b2b"/>
  <line x1="220" y1="150" x2="340" y2="150" stroke="#c62828" stroke-width="3"/>
  <line x1="220" y1="210" x2="340" y2="210" stroke="#3e2723" stroke-width="3"/>
  <line x1="220" y1="270" x2="340" y2="270" stroke="#ef6c00" stroke-width="3"/>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#c62828">5 V</text>
  <text x="258" y="262" text-anchor="middle" font-size="11" fill="#ef6c00">PWM 50 Hz</text>

  <!-- PIR AM312 -->
  <rect x="690" y="110" width="180" height="140" rx="8" fill="#eefaf0" stroke="#2b2b2b" stroke-width="2"/>
  <text x="780" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">PIR AM312</text>
  <text x="700" y="154" font-size="12" fill="#1a1a1a">VCC</text>
  <text x="700" y="214" font-size="12" fill="#1a1a1a">OUT</text>
  <text x="800" y="242" text-anchor="middle" font-size="12" fill="#1a1a1a">GND</text>
  <circle cx="690" cy="150" r="4" fill="#2b2b2b"/>
  <circle cx="690" cy="210" r="4" fill="#2b2b2b"/>
  <circle cx="800" cy="250" r="4" fill="#2b2b2b"/>
  <line x1="560" y1="150" x2="690" y2="150" stroke="#c62828" stroke-width="3"/>
  <line x1="560" y1="210" x2="690" y2="210" stroke="#2e7d32" stroke-width="3"/>
  <text x="625" y="142" text-anchor="middle" font-size="11" fill="#c62828">5 V</text>
  <text x="625" y="202" text-anchor="middle" font-size="11" fill="#2e7d32">salida digital</text>
  <text x="625" y="228" text-anchor="middle" font-size="10" fill="#555555">3.3 V en alto, pull-down interno</text>

  <!-- LED de estado -->
  <line x1="560" y1="320" x2="600" y2="320" stroke="#1565c0" stroke-width="3"/>
  <rect x="600" y="310" width="60" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="630" y="302" text-anchor="middle" font-size="11" fill="#1a1a1a">R 220 Ω</text>
  <line x1="660" y1="320" x2="690" y2="320" stroke="#1565c0" stroke-width="3"/>
  <polygon points="690,304 690,336 718,320" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="718" y1="304" x2="718" y2="336" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="704" y1="300" x2="714" y2="288" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="714,288 708,291 712,295" fill="#2b2b2b"/>
  <line x1="714" y1="302" x2="724" y2="290" stroke="#2b2b2b" stroke-width="1.5"/>
  <polygon points="724,290 718,293 722,297" fill="#2b2b2b"/>
  <text x="704" y="356" text-anchor="middle" font-size="11" fill="#1a1a1a">LED de estado</text>
  <text x="704" y="370" text-anchor="middle" font-size="10" fill="#555555">(indicador, no actuador)</text>
  <line x1="718" y1="320" x2="760" y2="320" stroke="#1565c0" stroke-width="3"/>
  <line x1="760" y1="320" x2="760" y2="460" stroke="#3e2723" stroke-width="3"/>

  <!-- GND común: servo, ESP32, PIR y LED -->
  <!-- the ground line hops over the servo signal line (no connection) -->
  <path d="M300 210 V262 A8 8 0 0 1 300 278 V460" fill="none" stroke="#3e2723" stroke-width="3"/>
  <line x1="300" y1="460" x2="600" y2="460" stroke="#3e2723" stroke-width="3"/>
  <circle cx="300" cy="210" r="5" fill="#3e2723"/>
  <circle cx="600" cy="460" r="5" fill="#3e2723"/>
  <circle cx="800" cy="460" r="5" fill="#3e2723"/>
  <line x1="560" y1="380" x2="600" y2="380" stroke="#3e2723" stroke-width="3"/>
  <line x1="600" y1="380" x2="600" y2="460" stroke="#3e2723" stroke-width="3"/>
  <line x1="800" y1="250" x2="800" y2="460" stroke="#3e2723" stroke-width="3"/>
  <line x1="600" y1="460" x2="800" y2="460" stroke="#3e2723" stroke-width="3"/>
  <circle cx="760" cy="460" r="5" fill="#3e2723"/>
  <line x1="690" y1="460" x2="690" y2="478" stroke="#3e2723" stroke-width="3"/>
  <line x1="670" y1="478" x2="710" y2="478" stroke="#3e2723" stroke-width="3"/>
  <line x1="677" y1="485" x2="703" y2="485" stroke="#3e2723" stroke-width="3"/>
  <line x1="684" y1="492" x2="696" y2="492" stroke="#3e2723" stroke-width="3"/>
  <circle cx="690" cy="460" r="5" fill="#3e2723"/>
  <text x="700" y="512" text-anchor="middle" font-size="12" fill="#1a1a1a">GND común</text>

  <!-- Leyenda -->
  <text x="50" y="350" font-size="13" font-weight="bold" fill="#1a1a1a">Conexiones</text>
  <line x1="50" y1="370" x2="80" y2="370" stroke="#c62828" stroke-width="3"/><text x="88" y="374" font-size="12" fill="#1a1a1a">Alimentación</text>
  <line x1="50" y1="392" x2="80" y2="392" stroke="#3e2723" stroke-width="3"/><text x="88" y="396" font-size="12" fill="#1a1a1a">Tierra (GND)</text>
  <line x1="50" y1="414" x2="80" y2="414" stroke="#ef6c00" stroke-width="3"/><text x="88" y="418" font-size="12" fill="#1a1a1a">Señal del actuador</text>
  <line x1="50" y1="436" x2="80" y2="436" stroke="#2e7d32" stroke-width="3"/><text x="88" y="440" font-size="12" fill="#1a1a1a">Señal del sensor</text>
  <line x1="50" y1="458" x2="80" y2="458" stroke="#1565c0" stroke-width="3"/><text x="88" y="462" font-size="12" fill="#1a1a1a">Indicador de conexión</text>
  <text x="50" y="500" font-size="11" fill="#555555">Una sola tierra: servo, ESP32, PIR y LED comparten GND. VIN (5 V) alimenta al servo y al PIR.</text>
  <text x="50" y="516" font-size="11" fill="#555555">La única resistencia del circuito es la del LED.</text>
</svg>
