<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" width="1060" height="770" font-family="Arial, Helvetica, sans-serif">
  <title>Placa 1 (ventilación): ESP32 DOIT DevKit V1, MQ-2 con divisor 10 kΩ / 15 kΩ y filtro de 100 nF hacia D34, servo SG90 en D13 con capacitor de 1000 µF, LED indicador de gas en D32, fuente externa de 5 V y tierra común</title>
  <rect x="0" y="0" width="1060" height="770" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1a1a1a">Placa 1 · ventilación (Thing smartloft-739264-vent)</text>

  <!-- ===== Rails ===== -->
  <line x1="60" y1="70" x2="1040" y2="70" stroke="#c62828" stroke-width="3"/>
  <text x="1040" y="62" text-anchor="end" font-size="12" fill="#c62828" font-weight="bold">Línea +5 V (fuente externa)</text>
  <line x1="60" y1="620" x2="1040" y2="620" stroke="#3e2723" stroke-width="3"/>
  <text x="1040" y="640" text-anchor="end" font-size="12" fill="#3e2723" font-weight="bold">Línea GND común</text>

  <!-- ===== External supply ===== -->
  <rect x="80" y="100" width="170" height="86" rx="8" fill="#fff6e6" stroke="#2b2b2b" stroke-width="2"/>
  <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Fuente 5 V / 2 A</text>
  <text x="165" y="144" text-anchor="middle" font-size="11" fill="#555555">jack 5.5 × 2.1 mm</text>
  <text x="165" y="160" text-anchor="middle" font-size="11" fill="#555555">5.337 V sin carga</text>
  <circle cx="110" cy="100" r="4" fill="#2b2b2b"/><text x="118" y="114" font-size="11" fill="#c62828">+</text>
  <line x1="110" y1="100" x2="110" y2="70" stroke="#c62828" stroke-width="3"/>
  <circle cx="110" cy="70" r="5" fill="#c62828"/>
  <circle cx="220" cy="186" r="4" fill="#2b2b2b"/><text x="228" y="182" font-size="11" fill="#3e2723">−</text>
  <path d="M220 186 V226" fill="none" stroke="#3e2723" stroke-width="3"/>
  <!-- supply GND goes down the far left to the rail -->
  <path d="M220 226 H70 V620" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="70" cy="620" r="5" fill="#3e2723"/>

  <!-- ===== MQ-2 module ===== -->
  <rect x="100" y="270" width="160" height="200" rx="8" fill="#eefaf0" stroke="#2b2b2b" stroke-width="2"/>
  <text x="180" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MQ-2</text>
  <text x="180" y="312" text-anchor="middle" font-size="11" fill="#555555">gas y humo (cocina)</text>
  <text x="250" y="344" text-anchor="end" font-size="12" fill="#1a1a1a">VCC</text>
  <text x="250" y="384" text-anchor="end" font-size="12" fill="#1a1a1a">AO</text>
  <text x="250" y="424" text-anchor="end" font-size="12" fill="#1a1a1a">DO</text>
  <text x="250" y="456" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>
  <circle cx="260" cy="340" r="4" fill="#2b2b2b"/>
  <circle cx="260" cy="380" r="4" fill="#2b2b2b"/>
  <circle cx="260" cy="420" r="4" fill="#2b2b2b"/>
  <circle cx="260" cy="452" r="4" fill="#2b2b2b"/>
  <!-- VCC to +5 V -->
  <path d="M260 340 H290 V70" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="290" cy="70" r="5" fill="#c62828"/>
  <text x="296" y="210" font-size="11" fill="#c62828">calefactor ≈ 150 mA</text>
  <!-- DO not connected -->
  <line x1="260" y1="420" x2="282" y2="420" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="276" y1="414" x2="288" y2="426" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="288" y1="414" x2="276" y2="426" stroke="#9e9e9e" stroke-width="2"/>
  <text x="294" y="424" font-size="10" fill="#777777">sin conectar</text>
  <!-- GND to rail -->
  <path d="M260 452 H275 V620" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="275" cy="620" r="5" fill="#3e2723"/>

  <!-- ===== Divider + filter ===== -->
  <line x1="260" y1="380" x2="330" y2="380" stroke="#2e7d32" stroke-width="3"/>
  <rect x="330" y="370" width="64" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="362" y="362" text-anchor="middle" font-size="11" fill="#1a1a1a">R1 10 kΩ</text>
  <line x1="394" y1="380" x2="560" y2="380" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="440" cy="380" r="5" fill="#2e7d32"/>
  <circle cx="500" cy="380" r="5" fill="#2e7d32"/>
  <text x="470" y="372" text-anchor="middle" font-size="11" fill="#2e7d32">nodo B</text>
  <!-- R2 15k to GND -->
  <line x1="440" y1="380" x2="440" y2="460" stroke="#2e7d32" stroke-width="3"/>
  <rect x="430" y="460" width="20" height="64" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="424" y="497" text-anchor="end" font-size="11" fill="#1a1a1a">R2 15 kΩ</text>
  <line x1="440" y1="524" x2="440" y2="620" stroke="#3e2723" stroke-width="3"/>
  <circle cx="440" cy="620" r="5" fill="#3e2723"/>
  <!-- C 100 nF to GND -->
  <line x1="500" y1="380" x2="500" y2="482" stroke="#2e7d32" stroke-width="3"/>
  <line x1="484" y1="482" x2="516" y2="482" stroke="#2b2b2b" stroke-width="3"/>
  <line x1="484" y1="494" x2="516" y2="494" stroke="#2b2b2b" stroke-width="3"/>
  <text x="508" y="474" font-size="11" fill="#1a1a1a">C</text>
  <text x="506" y="514" font-size="11" fill="#1a1a1a">100 nF</text>
  <text x="506" y="528" font-size="10" fill="#555555">("104")</text>
  <line x1="500" y1="494" x2="500" y2="620" stroke="#3e2723" stroke-width="3"/>
  <circle cx="500" cy="620" r="5" fill="#3e2723"/>

  <!-- ===== ESP32 ===== -->
  <rect x="560" y="200" width="220" height="330" rx="8" fill="#f2f5f8" stroke="#2b2b2b" stroke-width="2"/>
  <text x="670" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32</text>
  <text x="670" y="249" text-anchor="middle" font-size="13" fill="#1a1a1a">DOIT DevKit V1 (30 pines)</text>
  <text x="670" y="505" text-anchor="middle" font-size="11" fill="#555555">alimentada solo por USB</text>
  <text x="670" y="519" text-anchor="middle" font-size="11" fill="#555555">VIN y 3V3 no van a la línea de 5 V</text>
  <circle cx="560" cy="380" r="4" fill="#2b2b2b"/><text x="570" y="384" font-size="13" fill="#1a1a1a">D34 (ADC1, 11 dB)</text>
  <circle cx="560" cy="460" r="4" fill="#2b2b2b"/><text x="570" y="464" font-size="13" fill="#1a1a1a">GND</text>
  <circle cx="780" cy="290" r="4" fill="#2b2b2b"/><text x="770" y="294" text-anchor="end" font-size="13" fill="#1a1a1a">D13 (GPIO13)</text>
  <circle cx="780" cy="420" r="4" fill="#2b2b2b"/><text x="770" y="424" text-anchor="end" font-size="13" fill="#1a1a1a">D32 (GPIO32)</text>
  <circle cx="780" cy="330" r="4" fill="#bdbdbd"/><text x="770" y="334" text-anchor="end" font-size="12" fill="#9e9e9e">D25 (reservado)</text>
  <!-- ESP32 GND to rail -->
  <path d="M560 460 H540 V620" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="540" cy="620" r="5" fill="#3e2723"/>

  <!-- ===== Servo SG90 ===== -->
  <rect x="850" y="200" width="135" height="150" rx="8" fill="#eef4ff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="917" y="226" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Servo SG90</text>
  <text x="917" y="242" text-anchor="middle" font-size="11" fill="#555555">ventana</text>
  <text x="860" y="266" font-size="12" fill="#1a1a1a">V+ (rojo)</text>
  <text x="860" y="294" font-size="12" fill="#1a1a1a">Señal (naranja)</text>
  <text x="860" y="326" font-size="12" fill="#1a1a1a">GND (marrón)</text>
  <circle cx="850" cy="262" r="4" fill="#2b2b2b"/>
  <circle cx="850" cy="290" r="4" fill="#2b2b2b"/>
  <circle cx="850" cy="322" r="4" fill="#2b2b2b"/>
  <path d="M850 262 H826 V70" fill="none" stroke="#c62828" stroke-width="3"/>
  <circle cx="826" cy="70" r="5" fill="#c62828"/>
  <line x1="780" y1="290" x2="850" y2="290" stroke="#ef6c00" stroke-width="3"/>
  <text x="815" y="282" text-anchor="middle" font-size="10" fill="#ef6c00">PWM 50 Hz</text>
  <!-- servo GND hops over the LED wire (no connection) -->
  <path d="M850 322 H838 V412 A8 8 0 0 1 838 428 V620" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="838" cy="620" r="5" fill="#3e2723"/>
  <!-- Bulk capacitor 1000 uF between +5 V and GND, next to the servo -->
  <line x1="1015" y1="70" x2="1015" y2="452" stroke="#c62828" stroke-width="3"/>
  <circle cx="1015" cy="70" r="5" fill="#c62828"/>
  <line x1="997" y1="452" x2="1033" y2="452" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M997 470 Q1015 458 1033 470" fill="none" stroke="#2b2b2b" stroke-width="3"/>
  <text x="1001" y="446" text-anchor="end" font-size="12" fill="#c62828">+</text>
  <line x1="1015" y1="464" x2="1015" y2="620" stroke="#3e2723" stroke-width="3"/>
  <circle cx="1015" cy="620" r="5" fill="#3e2723"/>
  <text x="1005" y="496" text-anchor="end" font-size="11" fill="#1a1a1a">C 1000 µF</text>
  <text x="1005" y="510" text-anchor="end" font-size="11" fill="#1a1a1a">/ 10 V</text>
  <text x="1005" y="524" text-anchor="end" font-size="10" fill="#555555">"−" a GND</text>

  <!-- ===== Gas LED on D32 ===== -->
  <line x1="780" y1="420" x2="796" y2="420" stroke="#1565c0" stroke-width="3"/>
  <polygon points="796,406 796,434 820,420" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="820" y1="406" x2="820" y2="434" stroke="#2b2b2b" stroke-width="2"/>
  <line x1="806" y1="402" x2="814" y2="392" stroke="#2b2b2b" stroke-width="1.5"/>
  <line x1="814" y1="404" x2="822" y2="394" stroke="#2b2b2b" stroke-width="1.5"/>
  <text x="808" y="456" text-anchor="end" font-size="11" fill="#1a1a1a">LED de gas</text>
  <line x1="820" y1="420" x2="870" y2="420" stroke="#1565c0" stroke-width="3"/>
  <rect x="870" y="410" width="56" height="20" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
  <text x="898" y="402" text-anchor="middle" font-size="11" fill="#1a1a1a">220 Ω</text>
  <path d="M926 420 H940 V620" fill="none" stroke="#3e2723" stroke-width="3"/>
  <circle cx="940" cy="620" r="5" fill="#3e2723"/>

  <!-- ===== Calculations and legend ===== -->
  <rect x="250" y="652" width="790" height="104" rx="6" fill="#f7f7f5" stroke="#d6d4cd"/>
  <text x="262" y="674" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Divisor:</tspan> V_D34 = V_AO × 15 / (10 + 15) = 0.6 × V_AO → con AO = 5 V, D34 = 3.0 V (menor que 3.3 V)</text>
  <text x="262" y="694" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Índice de gas:</tspan> gas_pct = (V_D34 / 0.6) / 5340 mV × 100 · <tspan font-weight="bold">Filtro:</tspan> 10 kΩ ∥ 15 kΩ = 6 kΩ → f_c = 1 / (2π · 6 kΩ · 100 nF) ≈ 265 Hz</text>
  <text x="262" y="714" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Por qué D34:</tspan> es del ADC1; el ADC2 no funciona con el WiFi activo. <tspan font-weight="bold">LED:</tspan> I = (3.3 V − V_LED) / 220 Ω ≈ 6 mA con V_LED ≈ 2 V</text>
  <text x="262" y="734" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Alimentación:</tspan> MQ-2 y servo desde la fuente externa; la ESP32 por USB. Solo comparten el GND.</text>
  <line x1="30" y1="664" x2="56" y2="664" stroke="#c62828" stroke-width="3"/><text x="62" y="668" font-size="11" fill="#1a1a1a">+5 V externa</text>
  <line x1="30" y1="682" x2="56" y2="682" stroke="#3e2723" stroke-width="3"/><text x="62" y="686" font-size="11" fill="#1a1a1a">GND común</text>
  <line x1="30" y1="700" x2="56" y2="700" stroke="#2e7d32" stroke-width="3"/><text x="62" y="704" font-size="11" fill="#1a1a1a">Señal del sensor</text>
  <line x1="30" y1="718" x2="56" y2="718" stroke="#ef6c00" stroke-width="3"/><text x="62" y="722" font-size="11" fill="#1a1a1a">Señal del actuador</text>
  <line x1="30" y1="736" x2="56" y2="736" stroke="#1565c0" stroke-width="3"/><text x="62" y="740" font-size="11" fill="#1a1a1a">LED indicador de gas</text>
</svg>
