; SIS-234 Practice 3: smart studio apartment door connected to AWS IoT Core.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

; Production firmware: WiFi + MQTT over TLS + Device Shadow.
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    madhephaestus/ESP32Servo@^3.0.5

; Hardware test without AWS: Shadow messages travel over the Serial Monitor.
[env:local_test]
extends = env:esp32doit-devkit-v1
build_flags =
    -D LOCAL_TEST_MODE
