; SIS-234 Practice 4: SmartLoft, two ESP32 boards connected to AWS IoT Core.
;   vent   -> board 1 (ventilation): MQ-2 + window servo, Thing smartloft-<code>-vent
;   lights -> board 2 (lights and entrance): 5 LEDs + PIR, Thing smartloft-<code>-lights
; Shared code: lib/SmartObjectCore. Board code: src/vent and src/lights.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = vent, lights

; Settings shared by every environment.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Besides showing the Serial Monitor, save each session in logs/*.log (evidence).
monitor_filters = default, log2file
; Opening the monitor must not reset the board: a stability run can then be
; observed from several monitor sessions without a restart in between.
monitor_dtr = 0
monitor_rts = 0
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Board 1 production firmware: WiFi + MQTT over TLS + Device Shadow.
[env:vent]
board = esp32doit-devkit-v1
build_src_filter = +<vent/>
build_flags =
    -D BOARD_VENT
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo@^3.0.5

; Board 2 production firmware (ESP32-DevKitC, 38 pins).
[env:lights]
board = esp32dev
build_src_filter = +<lights/>
build_flags =
    -D BOARD_LIGHTS

; Hardware tests without AWS: Shadow messages travel over the Serial Monitor.
[env:vent_local_test]
extends = env:vent
build_flags =
    ${env:vent.build_flags}
    -D LOCAL_TEST_MODE

[env:lights_local_test]
extends = env:lights
build_flags =
    ${env:lights.build_flags}
    -D LOCAL_TEST_MODE
